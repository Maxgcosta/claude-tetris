<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
  <h1 class="game-title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UP</span>
          <span class="value value-sm" id="powerup">—</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <button id="theme-toggle" type="button">🌙 Modo oscuro</button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="new-record" class="new-record hidden">
          <p class="new-record-title">¡Nuevo récord!</p>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="save-record-btn" type="button">Guardar</button>
          </div>
        </div>
        <div id="over-records" class="records hidden"></div>
        <div class="btn-row">
          <button id="restart-btn">Reiniciar</button>
          <button id="over-reset-btn" class="btn-secondary" type="button">Borrar records</button>
        </div>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <p class="records-heading">Top 5</p>
        <div id="start-records" class="records"></div>
        <div class="btn-row">
          <button id="start-btn" type="button">Jugar</button>
          <button id="start-reset-btn" class="btn-secondary" type="button">Borrar records</button>
        </div>
      </div>
    </div>
  </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
