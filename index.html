<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
  <h1 class="game-title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UP</span>
          <span class="value value-sm" id="powerup">—</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <button id="theme-toggle" type="button">🌙 Modo oscuro</button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <form id="record-form" class="record-form hidden" autocomplete="off">
          <label for="player-name" class="label">¡ENTRASTE AL TOP 5! TU NOMBRE</label>
          <div class="record-form-row">
            <input id="player-name" type="text" maxlength="10" placeholder="Anónimo" />
            <button type="submit" id="save-record-btn">Guardar</button>
          </div>
        </form>

        <div id="records-box" class="records-box hidden">
          <span class="label">MEJORES PUNTUACIONES</span>
          <ol id="records-list"></ol>
          <p id="records-extra"></p>
          <button id="reset-records-btn" type="button">Resetear records</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
